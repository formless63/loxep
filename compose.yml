# Loxep default deployment stack (ADR-0013 / ADR-0018 as amended).
#
#   cp .env.example .env    # then fill in the required values
#   docker compose up -d
#   docker compose exec loxep node bin/loxep.ts migrate   # explicit, advisory-locked
#
# Services: loxep (LOXEP_MODE=all) + loxep-db (TimescaleDB). Exactly these
# containers and no others — no one-shot service containers (ADR-0018
# amendment: migrations run by exec into the running app container, never as
# a separate compose service). The app boots safely against an unmigrated
# database: readiness fails with a pending-count message until the operator
# runs the migrate command above; startup itself never mutates schema.
#
# The optional `rustfs` profile adds a generic S3-compatible object-storage
# companion (ADR-0014):
#   docker compose --profile rustfs up -d
#
# Scale-out later uses this same image with LOXEP_MODE=web / LOXEP_MODE=worker
# replicas against the shared PostgreSQL (ADR-0013).

name: loxep

services:
  postgres:
    # TimescaleDB Community image (TSL-licensed features included) is
    # deliberate: the observation hypertable's columnstore policy requires
    # Community capabilities (ADR-0002). Not exposed to the host by default.
    image: timescale/timescaledb-ha:pg18.4-ts2.29.2-all@sha256:6a617f8a908f6c6787ce0b582226022caff150d16754724d653fdfca0f8ce7de
    container_name: loxep-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: loxep
    volumes:
      # timescaledb-ha images keep PGDATA under /home/postgres/pgdata/data.
      - postgres-data-ha:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loxep"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  loxep:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${LOXEP_IMAGE:-loxep}
    container_name: loxep
    env_file: .env
    environment:
      LOXEP_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/loxep
      LOXEP_MEDIA_ROOT: /data/media
    ports:
      - "3020:3020"
    volumes:
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(`http://127.0.0.1:$${process.env.LOXEP_PORT ?? 3020}/health/ready`).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    restart: unless-stopped

  # Optional generic S3-compatible object-storage companion (ADR-0014);
  # Loxep talks plain S3 to it at http://rustfs:9000 and any compatible
  # backend can substitute. Enable with: docker compose --profile rustfs up -d
  rustfs:
    profiles: ["rustfs"]
    image: rustfs/rustfs:1.0.0-rc.4@sha256:a9fbb5e5bfce09ccd0869ac9a7b0e39191c6868d75ec4c5d08ebbd5475db5d6b
    container_name: loxep-rustfs
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_HEALTH_ENDPOINT_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      # Admin console only; the S3 API stays on the internal network.
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data-ha:
  media-data:
  rustfs-data:
