# Auto-merge only Dependabot's GitHub Actions ROUTINE group once CI passes.
#
# The changed actions execute in the gating CI run. Bun, Docker, and Compose
# updates use the `review-required` group because the hosted CI does not yet
# exercise every database-backed package suite or validate container migration
# behavior. Majors remain individual PRs and are never auto-merged.
#
# Triggered by CI completing (not by the PR itself) so the merge decision
# always follows a real green run on the PR's head.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-routine:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/routine-')
    runs-on: ubuntu-24.04
    steps:
      - name: Merge the routine PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            echo "no open PR for $BRANCH (already merged/closed)"; exit 0
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
