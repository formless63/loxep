# Auto-merge Dependabot's ROUTINE group PRs once CI passes.
#
# Safety comes from construction, not inspection: dependabot.yml groups only
# minor+patch updates into the `routine` group, so a branch matching
# dependabot/*/routine-* can never contain a major. Majors arrive as
# individual PRs on differently-named branches and are never touched here —
# they feed the deliberate-major queue (dependency-policy.md).
#
# Triggered by CI completing (not by the PR itself) so the merge decision
# always follows a real green run on the PR's head.
name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-routine:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      contains(github.event.workflow_run.head_branch, '/routine-')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the routine PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            echo "no open PR for $BRANCH (already merged/closed)"; exit 0
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
